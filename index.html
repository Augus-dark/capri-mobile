<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3C3A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Capri</title>
<style>
  :root {
    --fundo: #122B2A;      /* água do rio */
    --margem: #1B3C3A;     /* margem: cabeçalho e campo */
    --linha: #2E5A54;
    --linha2: #3A6B64;
    --capri: #1F403C;      /* fala da Capri */
    --pelagem: #8A5A34;    /* fala do usuário */
    --sol: #F0B84A;        /* destaque */
    --sol2: #D9A23A;
    --texto: #EFE7D6;
    --suave: #8FB0A6;
    --perigo: #C65D4B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fundo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  button { font: inherit; color: var(--texto); border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--sol); outline-offset: 2px; }

  header {
    display: flex; align-items: center; gap: 10px; background: var(--margem);
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  #mascote { width: 58px; height: 58px; flex: none; }
  .nome { flex: 1; min-width: 0; }
  .nome h1 {
    margin: 0; font: 700 30px/1 ui-serif, Georgia, "Noto Serif", "Times New Roman", serif; letter-spacing: .2px;
  }
  .nome small { display: block; color: var(--suave); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ic { width: 42px; height: 42px; border-radius: 50%; background: var(--linha); display: grid; place-items: center; flex: none; }
  .ic:active { background: var(--linha2); }
  .ic.parar { background: var(--perigo); color: #FFF4EC; }
  .ic.parar:active { background: #A84636; }
  .ic[hidden] { display: none; }

  #chat { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 9px; overscroll-behavior: contain; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.capri { background: var(--capri); border: 1px solid var(--linha); align-self: flex-start; border-bottom-left-radius: 6px; }
  .msg.voce { background: var(--pelagem); color: #FBF3E6; align-self: flex-end; border-bottom-right-radius: 6px; }
  .msg.sis { align-self: flex-start; background: none; color: var(--suave); font-style: italic; font-size: 13.5px; padding: 0 8px; }
  .msg.erro { align-self: flex-start; background: #3A2420; border: 1px solid var(--perigo); color: #FFD9CF; }
  .foto { display: block; max-width: 100%; max-height: 220px; border-radius: 12px; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip { background: var(--sol); color: #20170A; text-decoration: none; font-weight: 700; padding: 10px 16px; border-radius: 22px; }
  .chip:active { background: var(--sol2); }

  #barra { min-height: 22px; padding: 0 20px; color: var(--suave); font-size: 13.5px; font-style: italic; }
  footer { display: flex; align-items: center; gap: 8px; padding: 6px 12px calc(12px + env(safe-area-inset-bottom)); }
  footer input {
    flex: 1; min-width: 0; height: 46px; font: inherit; color: var(--texto); background: var(--margem);
    border: 1px solid var(--linha); border-radius: 23px; padding: 0 18px;
  }
  footer input::placeholder { color: var(--suave); }
  footer input:focus-visible { outline: none; border-color: var(--sol); }
  .redondo { width: 46px; height: 46px; background: var(--margem); border: 1px solid var(--linha); }
  .redondo.ativo { background: var(--perigo); border-color: var(--perigo); }
  .enviar { width: 46px; height: 46px; border-radius: 50%; background: var(--sol); color: #20170A; display: grid; place-items: center; flex: none; }
  .enviar:active { background: var(--sol2); }

  dialog {
    background: var(--margem); color: var(--texto); border: 0; padding: 20px 18px 0;
    width: 100%; max-width: 520px; margin: auto auto 0; border-radius: 24px 24px 0 0; max-height: 92dvh; overflow-y: auto;
  }
  dialog::backdrop { background: rgba(5, 14, 14, .65); }
  dialog h2:focus { outline: none; }
  dialog h2 { margin: 0 0 4px; font: 700 22px ui-serif, Georgia, "Noto Serif", serif; }
  label { display: block; margin: 14px 0 5px; color: var(--suave); font-size: 13px; }
  dialog input[type=text], dialog input[type=password] {
    width: 100%; height: 44px; font: inherit; color: var(--texto); background: var(--fundo);
    border: 1px solid var(--linha); border-radius: 12px; padding: 0 12px;
  }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { background: var(--linha); border-radius: 22px; height: 42px; padding: 0 16px; }
  .btn.sol { background: var(--sol); color: #20170A; font-weight: 700; }
  .btn.perigo { background: var(--perigo); color: #FFF4EC; }
  .chk { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .chk input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; flex: none; border: 2px solid var(--linha2); border-radius: 8px; background: var(--fundo); margin: 0; }
  .chk input:checked { background: var(--sol); border-color: var(--sol); }
  .chk input:checked::after { content: ""; display: block; width: 6px; height: 12px; border: solid #20170A; border-width: 0 3px 3px 0; transform: rotate(45deg); margin: 1px 0 0 7px; }
  .chk label { margin: 0; color: var(--texto); font-size: 15px; }
  .acoes { position: sticky; bottom: 0; background: var(--margem); justify-content: flex-end; margin-top: 10px; padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linha); }
  .nota { color: var(--suave); font-size: 12.5px; line-height: 1.5; margin: 14px 0 0; }
</style>
</head>
<body>

<header>
  <div id="mascote" aria-hidden="true"></div>
  <div class="nome">
    <h1>capri</h1>
    <small id="credito"></small>
  </div>
  <button id="btnParar" class="ic parar" hidden aria-label="Parar"><span data-i="stop"></span></button>
  <button id="instalar" class="ic" hidden aria-label="Instalar o app"><span data-i="baixar"></span></button>
  <button id="btnVoz" class="ic" aria-label="Ligar ou desligar a voz"></button>
  <button id="btnCfg" class="ic" aria-label="Configurações"><span data-i="ajustes"></span></button>
</header>

<main id="chat" aria-live="polite"></main>
<div id="barra"></div>

<footer>
  <input id="txt" type="text" placeholder="Escreva para a Capri" autocomplete="off" enterkeyhint="send">
  <button id="btnFoto" class="ic redondo" aria-label="Mostrar uma foto para a Capri"><span data-i="camera"></span></button>
  <button id="mic" class="ic redondo" aria-label="Falar"><span data-i="mic"></span></button>
  <button id="enviar" class="enviar" aria-label="Enviar"><span data-i="enviar"></span></button>
</footer>
<input id="foto" type="file" accept="image/*" hidden>

<dialog id="cfg">
  <h2 tabindex="-1" autofocus>Configurações</h2>

  <label for="fCriador">Nome do criador</label>
  <input id="fCriador" type="text" maxlength="40" placeholder="Augusto">

  <label for="fChave">Chave da API (Groq: começa com gsk_)</label>
  <input id="fChave" type="password" autocomplete="off" placeholder="gsk_...">

  <label for="fModelo">Modelo de conversa</label>
  <input id="fModelo" type="text" autocomplete="off">

  <label for="fModeloVisao">Modelo que olha fotos</label>
  <input id="fModeloVisao" type="text" autocomplete="off">

  <label for="fBase">Endereço da API</label>
  <input id="fBase" type="text" autocomplete="off">
  <div class="linha">
    <button id="pGroq" type="button" class="btn">Usar Groq</button>
    <button id="pOpen" type="button" class="btn">Usar OpenRouter</button>
  </div>

  <div class="chk"><input id="fVoz" type="checkbox"><label for="fVoz">A Capri fala as respostas</label></div>

  <div class="linha">
    <button id="verMem" type="button" class="btn">O que a Capri lembra</button>
    <button id="limpaMem" type="button" class="btn perigo">Apagar memórias</button>
  </div>
  <p class="nota">A chave fica salva só neste aparelho. Para falar, use o Chrome e permita o microfone.
  Abrir sites, ligar e mandar mensagem aparecem como botões: você toca para confirmar.
  As fotos são enviadas à IA para serem analisadas e não ficam salvas.</p>

  <div class="linha acoes">
    <button id="fechaCfg" type="button" class="btn">Cancelar</button>
    <button id="salvaCfg" type="button" class="btn sol">Salvar</button>
  </div>
</dialog>

<script>
"use strict";
const CRIADOR_PADRAO = "Augusto";   // nome inicial do criador (também dá para mudar em Configurações)
const BASE_GROQ = "https://api.groq.com/openai/v1";
const BASE_OPENROUTER = "https://openrouter.ai/api/v1";
const MODELO_PADRAO = "openai/gpt-oss-20b";
const VISAO_PADRAO = "qwen/qwen3.8-27b";

const ler = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const $ = (id) => document.getElementById(id);

let cfg = Object.assign({ chave: "", criador: CRIADOR_PADRAO, base: BASE_GROQ, modelo: MODELO_PADRAO,
                          modeloVisao: VISAO_PADRAO, voz: true }, ler("capri_cfg", {}));
let memorias = ler("capri_mem", []);
let notas = ler("capri_notas", []);
let historico = [];
let ocupado = false, ouvindo = false, falando = false, olhando = false;
let ctrl = null;

// ---------- ícones ----------
const ICONES = {
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  enviar: '<path d="M3.5 11.5L20.5 3.5l-8 17-2.2-7z" fill="currentColor"/>',
  voz: '<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>',
  mudo: '<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5"/>',
  ajustes: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/>',
  baixar: '<path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 19.5h14"/>',
};
function icone(nome) {
  return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONES[nome] + "</svg>";
}
function pintaIcones() { document.querySelectorAll("[data-i]").forEach((e) => { e.innerHTML = icone(e.dataset.i); }); }

// ---------- mascote ----------
const C = { agua: "#244F4B", linha: "#2E5A54", linha2: "#3A6B64", pelo: "#A8703F", pelo2: "#6F4527", focinho: "#C99A66",
            narina: "#3A2412", olho: "#1B120A", sol: "#F0B84A", boca: "#3A1F10" };
const oval = (a, b, c, d, fill, stroke, w) =>
  `<ellipse cx="${(a + c) / 2}" cy="${(b + d) / 2}" rx="${(c - a) / 2}" ry="${(d - b) / 2}" fill="${fill || "none"}"` +
  (stroke ? ` stroke="${stroke}" stroke-width="${w}"` : "") + "/>";
const rrect = (a, b, c, d, r, fill) => `<rect x="${a}" y="${b}" width="${c - a}" height="${d - b}" rx="${r}" fill="${fill}"/>`;
const linhaSvg = (x1, y1, x2, y2, cor, w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${cor}" stroke-width="${w}" stroke-linecap="round"/>`;
function arco(a, b, c, d, a0, a1, cor, w) {
  const cx = (a + c) / 2, cy = (b + d) / 2, rx = (c - a) / 2, ry = (d - b) / 2, r = Math.PI / 180;
  const p = (g) => `${(cx + rx * Math.cos(g * r)).toFixed(2)} ${(cy + ry * Math.sin(g * r)).toFixed(2)}`;
  return `<path d="M${p(a0)} A${rx} ${ry} 0 0 1 ${p(a1)}" fill="none" stroke="${cor}" stroke-width="${w}" stroke-linecap="round"/>`;
}
function formas(estado, q) {
  const f = [
    oval(2, 2, 70, 70, C.agua, C.linha, 2),
    rrect(12, 13, 24, 25, 5, C.pelo2), rrect(48, 13, 60, 25, 5, C.pelo2),
    rrect(10, 17, 62, 58, 17, C.pelo), rrect(15, 33, 57, 63, 13, C.focinho),
    oval(26, 37, 32, 43, C.narina), oval(40, 37, 46, 43, C.narina),
  ];
  const olhos = [[22, 28], [50, 28]];
  if (estado === "pensando") {
    olhos.forEach(([x, y]) => f.push(linhaSvg(x - 4, y, x + 4, y, C.olho, 2)));
    const ativo = Math.floor(q / 3) % 3;
    [29, 36, 43].forEach((x, i) => f.push(oval(x - 2, 5, x + 2, 9, i === ativo ? C.sol : C.linha2)));
  } else if (estado === "ouvindo") {
    olhos.forEach(([x, y]) => { f.push(oval(x - 4, y - 4, x + 4, y + 4, C.olho)); f.push(oval(x - 2, y - 3, x, y - 1, "#FFFFFF")); });
    const l = 2 + (Math.floor(q / 3) % 2);
    f.push(arco(3, 20, 15, 44, 135, 225, C.sol, l)); f.push(arco(57, 20, 69, 44, -45, 45, C.sol, l));
  } else {
    const piscar = estado === "parado" && (q % 26 === 0 || q % 26 === 1);
    olhos.forEach(([x, y]) => f.push(piscar ? linhaSvg(x - 4, y, x + 4, y, C.olho, 2) : oval(x - 3, y - 3, x + 3, y + 3, C.olho)));
    if (estado === "falando") f.push(Math.floor(q / 2) % 2 === 0 ? oval(29, 52, 43, 58, C.boca) : linhaSvg(29, 54, 43, 54, C.boca, 2));
    if (estado === "vendo") { olhos.forEach(([x, y]) => f.push(oval(x - 8, y - 8, x + 8, y + 8, null, C.sol, 2))); f.push(linhaSvg(30, 28, 42, 28, C.sol, 2)); }
  }
  return f.join("");
}
const reduzMovimento = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let quadro = 0, chaveMascote = "";
function estadoMascote() {
  if (ouvindo) return "ouvindo";
  if (falando) return "falando";
  if (olhando) return "vendo";
  if (ocupado) return "pensando";
  return "parado";
}
function tickMascote() {
  quadro += reduzMovimento ? 0 : 1;
  const e = estadoMascote(), q = reduzMovimento ? 3 : quadro;
  const balde = { parado: q % 26 < 2, pensando: Math.floor(q / 3) % 3, ouvindo: Math.floor(q / 3) % 2, falando: Math.floor(q / 2) % 2, vendo: 0 }[e];
  const chave = e + ":" + balde;
  if (chave !== chaveMascote) {
    chaveMascote = chave;
    $("mascote").innerHTML = '<svg viewBox="0 0 72 72" width="100%" height="100%">' + formas(e, q) + "</svg>";
  }
  atualizaEstado();
}
function atualizaEstado() {
  const e = estadoMascote();
  $("barra").textContent = { parado: "", pensando: "Pensando...", ouvindo: "Ouvindo, pode falar...", falando: "Falando...", vendo: "Olhando a foto..." }[e];
  $("btnParar").hidden = !(ocupado || ouvindo || falando);
  $("mic").classList.toggle("ativo", ouvindo);
}

// ---------- conversa ----------
function msg(quem, texto) {
  const d = document.createElement("div");
  d.className = "msg " + quem;
  d.textContent = texto;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}
function mensagemFoto(dataUrl, texto) {
  const d = document.createElement("div");
  d.className = "msg voce";
  const im = document.createElement("img");
  im.className = "foto"; im.src = dataUrl; im.alt = "Foto enviada";
  const p = document.createElement("span");
  p.textContent = texto;
  d.appendChild(im); d.appendChild(p);
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}
function botaoLink(rotulo, url) {
  const d = document.createElement("div");
  d.className = "chips";
  const a = document.createElement("a");
  a.className = "chip"; a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = rotulo;
  d.appendChild(a);
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}
function atualizaTopo() {
  $("credito").textContent = "criada por " + cfg.criador;
  $("btnVoz").innerHTML = icone(cfg.voz ? "voz" : "mudo");
  document.title = "Capri, criada por " + cfg.criador;
}

// ---------- voz ----------
function falar(texto) {
  if (!cfg.voz || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto.replace(/[*_`#]/g, ""));
  u.lang = "pt-BR";
  const v = speechSynthesis.getVoices().find((x) => (x.lang || "").toLowerCase().startsWith("pt"));
  if (v) u.voice = v;
  u.onstart = () => { falando = true; };
  u.onend = u.onerror = () => { falando = false; };
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let reconhecedor = null;
function ouvir() {
  if (!SR) { msg("sis", "Este navegador não tem reconhecimento de voz. Use o Chrome."); return; }
  if (reconhecedor) { reconhecedor.stop(); return; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  const r = new SR();
  reconhecedor = r;
  r.lang = "pt-BR"; r.interimResults = false; r.maxAlternatives = 1;
  ouvindo = true;
  r.onresult = (e) => { const t = e.results[0][0].transcript; if (t) enviar(t); };
  r.onerror = (e) => { if (e.error === "not-allowed") msg("erro", "Permita o uso do microfone no navegador."); };
  r.onend = () => { reconhecedor = null; ouvindo = false; };
  r.start();
}
function parar() {
  if (ctrl) ctrl.abort();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (reconhecedor) reconhecedor.stop();
  falando = false;
}

// ---------- ferramentas ----------
function f(nome, desc, props, obrig) {
  return { type: "function", function: { name: nome, description: desc, parameters: { type: "object", properties: props, required: obrig } } };
}
const TOOLS = [
  f("abrir_site", "Mostra um botão para abrir um site.", { url: { type: "string" } }, ["url"]),
  f("pesquisar_web", "Mostra um botão que pesquisa algo no Google.", { consulta: { type: "string" } }, ["consulta"]),
  f("youtube", "Mostra um botão que busca algo no YouTube.", { busca: { type: "string" } }, ["busca"]),
  f("mapa", "Mostra um botão que abre um lugar no mapa.", { local: { type: "string" } }, ["local"]),
  f("ligar", "Mostra um botão para ligar para um número.", { numero: { type: "string" } }, ["numero"]),
  f("whatsapp", "Mostra um botão para abrir o WhatsApp com uma mensagem pronta. O número é opcional, com DDI e DDD (ex.: 5511999998888).",
    { numero: { type: "string" }, texto: { type: "string" } }, ["texto"]),
  f("sms", "Mostra um botão para mandar um SMS.", { numero: { type: "string" }, texto: { type: "string" } }, ["numero", "texto"]),
  f("hora_data", "Informa a data e a hora atuais.", {}, []),
  f("calcular", "Calcula uma expressão matemática simples (+ - * / ( ) %).", { expressao: { type: "string" } }, ["expressao"]),
  f("temporizador", "Inicia um temporizador (precisa do app aberto).", { minutos: { type: "number" }, rotulo: { type: "string" } }, ["minutos"]),
  f("bateria", "Informa o nível de bateria do celular.", {}, []),
  f("lembrar", "Guarda um fato curto sobre o usuário para usar depois.", { fato: { type: "string" } }, ["fato"]),
  f("esquecer", "Apaga as memórias que contenham o texto informado.", { texto: { type: "string" } }, ["texto"]),
  f("listar_memorias", "Lista o que a Capri lembra do usuário.", {}, []),
  f("criar_nota", "Salva uma anotação no aparelho.", { texto: { type: "string" } }, ["texto"]),
  f("listar_notas", "Lista as anotações salvas.", {}, []),
];
const soDigitos = (s) => String(s || "").replace(/[^\d+]/g, "");

async function executar(nome, a) {
  switch (nome) {
    case "abrir_site": {
      let u = String(a.url || "").trim();
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      botaoLink("Abrir " + u.replace(/^https?:\/\//i, "").split("/")[0], u);
      return "Botão do site mostrado. Peça ao usuário para tocar nele.";
    }
    case "pesquisar_web":
      botaoLink("Pesquisar: " + a.consulta, "https://www.google.com/search?q=" + encodeURIComponent(a.consulta || ""));
      return "Botão de pesquisa mostrado. Peça ao usuário para tocar nele.";
    case "youtube":
      botaoLink("YouTube: " + a.busca, "https://www.youtube.com/results?search_query=" + encodeURIComponent(a.busca || ""));
      return "Botão do YouTube mostrado. Peça ao usuário para tocar nele.";
    case "mapa":
      botaoLink("Mapa: " + a.local, "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(a.local || ""));
      return "Botão do mapa mostrado. Peça ao usuário para tocar nele.";
    case "ligar": {
      const n = soDigitos(a.numero);
      if (!n) return "Número inválido.";
      botaoLink("Ligar para " + n, "tel:" + n);
      return "Botão de ligação mostrado. Peça ao usuário para tocar nele.";
    }
    case "whatsapp": {
      const n = soDigitos(a.numero).replace(/^\+/, "");
      botaoLink("Abrir o WhatsApp", "https://wa.me/" + n + "?text=" + encodeURIComponent(a.texto || ""));
      return "Botão do WhatsApp mostrado. A mensagem só é enviada quando o usuário tocar em enviar no WhatsApp.";
    }
    case "sms": {
      const n = soDigitos(a.numero);
      if (!n) return "Número inválido.";
      botaoLink("SMS para " + n, "sms:" + n + "?body=" + encodeURIComponent(a.texto || ""));
      return "Botão de SMS mostrado. Peça ao usuário para tocar nele.";
    }
    case "hora_data":
      return new Date().toLocaleString("pt-BR", { dateStyle: "full", timeStyle: "short" });
    case "calcular": {
      const e = String(a.expressao || "").replace(/,/g, ".").replace(/x/gi, "*");
      if (!/^[0-9+\-*/().%\s]+$/.test(e)) return "Expressão inválida.";
      try { const r = Function('"use strict"; return (' + e + ")")(); return Number.isFinite(r) ? String(r) : "Resultado inválido."; }
      catch (x) { return "Não consegui calcular."; }
    }
    case "temporizador": {
      const min = Math.max(0.1, Math.min(180, Number(a.minutos) || 1));
      const rot = a.rotulo || "Temporizador";
      setTimeout(() => {
        const t = rot + " terminou!";
        msg("capri", t); falar(t);
        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      }, min * 60000);
      return "Temporizador de " + min + " minuto(s) iniciado. Funciona enquanto o app estiver aberto.";
    }
    case "bateria": {
      if (!navigator.getBattery) return "Este navegador não informa a bateria.";
      const b = await navigator.getBattery();
      return Math.round(b.level * 100) + "%" + (b.charging ? " (carregando)" : "");
    }
    case "lembrar": {
      const fato = String(a.fato || "").trim().slice(0, 300);
      if (!fato) return "Nada para lembrar.";
      if (!memorias.includes(fato)) memorias.push(fato);
      memorias = memorias.slice(-40); gravar("capri_mem", memorias);
      return "Memória salva.";
    }
    case "esquecer": {
      const t = String(a.texto || "").toLowerCase();
      memorias = memorias.filter((m) => !m.toLowerCase().includes(t)); gravar("capri_mem", memorias);
      return "Memória atualizada.";
    }
    case "listar_memorias":
      return memorias.length ? memorias.join("\n") : "Ainda não lembro de nada.";
    case "criar_nota":
      notas.push(new Date().toLocaleString("pt-BR") + ": " + String(a.texto || "").slice(0, 500));
      notas = notas.slice(-100); gravar("capri_notas", notas);
      return "Nota salva.";
    case "listar_notas":
      return notas.length ? notas.slice(-15).join("\n") : "Nenhuma nota salva.";
  }
  return "Ferramenta desconhecida.";
}

// ---------- cérebro ----------
function sistema() {
  let s = "Você é a Capri, uma assistente virtual simpática no celular do usuário. Responda em português do Brasil, "
    + "em 1 a 3 frases curtas, sem markdown. Use as ferramentas quando o usuário pedir algo. "
    + "Abrir sites, ligar, SMS e WhatsApp aparecem como botões que o usuário precisa tocar: nunca diga que já abriu, ligou ou enviou. "
    + "O usuário pode mostrar fotos pela câmera; quando isso acontece, você recebe a descrição no histórico. "
    + "Nunca peça nem guarde senhas ou dados sensíveis. Nunca invente que fez algo: confie no resultado das ferramentas. "
    + "Você foi criada por " + cfg.criador + "; se perguntarem quem te criou, diga isso. "
    + "Agora é " + new Date().toLocaleString("pt-BR", { dateStyle: "full", timeStyle: "short" }) + ".";
  if (memorias.length) s += "\n\nO que você lembra do usuário:\n" + memorias.map((m) => "- " + m).join("\n");
  return s;
}
const urlApi = () => cfg.base.replace(/\/+$/, "") + "/chat/completions";
const chamarApi = (corpo) => fetch(urlApi(), {
  method: "POST", signal: ctrl.signal,
  headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.chave },
  body: JSON.stringify(corpo),
});

async function conversar(texto) {
  historico.push({ role: "user", content: texto });
  const msgs = [{ role: "system", content: sistema() }, ...historico.slice(-12)];
  for (let i = 0; i < 6; i++) {
    const r = await chamarApi({ model: cfg.modelo, messages: msgs, tools: TOOLS, tool_choice: "auto" });
    if (!r.ok) throw new Error("Erro " + r.status + ": " + (await r.text()).slice(0, 220));
    const m = (await r.json()).choices[0].message;
    if (!m.tool_calls || !m.tool_calls.length) {
      const final = m.content || "Pronto!";
      historico.push({ role: "assistant", content: final });
      return final;
    }
    msgs.push({ role: "assistant", content: m.content || "", tool_calls: m.tool_calls });
    for (const tc of m.tool_calls) {
      let args = {};
      try { args = JSON.parse(tc.function.arguments || "{}"); } catch (e) {}
      let res;
      try { res = await executar(tc.function.name, args); } catch (e) { res = "Erro: " + e.message; }
      msgs.push({ role: "tool", tool_call_id: tc.id, content: String(res) });
    }
  }
  return "Não consegui terminar essa tarefa.";
}

function mensagemDeErro(e) {
  if (e.name === "AbortError") return null;
  if (e instanceof TypeError) {
    return "Não consegui falar com a API. Confira a internet e a chave. Se estiver tudo certo, o provedor pode estar bloqueando chamadas diretas do navegador (erro de CORS): tente em Configurações, Usar OpenRouter.";
  }
  return "Ops, deu erro: " + e.message;
}

async function enviar(textoDireto) {
  const texto = (textoDireto || $("txt").value).trim();
  if (!texto || ocupado) return;
  if (!cfg.chave) { abreCfg(); msg("sis", "Cole a sua chave da API para começar."); return; }
  $("txt").value = "";
  msg("voce", texto);
  ocupado = true; ctrl = new AbortController();
  try {
    const resp = await conversar(texto);
    msg("capri", resp);
    falar(resp);
  } catch (e) {
    const t = mensagemDeErro(e);
    if (t) msg("erro", t); else msg("sis", "Interrompido.");
  }
  ocupado = false; ctrl = null;
}

// ---------- fotos (a câmera é a "tela" do celular) ----------
async function redimensionar(arquivo, lado = 1280) {
  const url = URL.createObjectURL(arquivo);
  try {
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = url; });
    const k = Math.min(1, lado / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  } finally { URL.revokeObjectURL(url); }
}
async function perguntarVisao(pergunta, dataUrl) {
  const corpo = { model: cfg.modeloVisao, max_completion_tokens: 2000,
    messages: [{ role: "user", content: [{ type: "text", text: pergunta }, { type: "image_url", image_url: { url: dataUrl } }] }] };
  let r = await chamarApi(Object.assign({ reasoning_effort: "low" }, corpo));
  if (!r.ok) {
    const t = await r.text();
    if (!/reasoning/i.test(t)) throw new Error("Erro " + r.status + ": " + t.slice(0, 220));
    r = await chamarApi(corpo);
    if (!r.ok) throw new Error("Erro " + r.status + ": " + (await r.text()).slice(0, 220));
  }
  const j = await r.json();
  const txt = (j.choices[0].message.content || "").replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  return txt || "O modelo não devolveu texto. Tente de novo.";
}
async function enviarFoto(arquivo) {
  if (!arquivo || ocupado) return;
  if (!cfg.chave) { abreCfg(); msg("sis", "Cole a sua chave da API para começar."); return; }
  const pergunta = $("txt").value.trim() || "O que você vê nesta foto?";
  $("txt").value = "";
  let dataUrl;
  try { dataUrl = await redimensionar(arquivo); } catch (e) { msg("erro", "Não consegui abrir essa imagem."); return; }
  mensagemFoto(dataUrl, pergunta);
  ocupado = true; olhando = true; ctrl = new AbortController();
  try {
    const resp = await perguntarVisao(pergunta + "\n\nResponda em português do Brasil, de forma objetiva.", dataUrl);
    historico.push({ role: "user", content: "[O usuário mostrou uma foto] " + pergunta });
    historico.push({ role: "assistant", content: resp });
    msg("capri", resp);
    falar(resp);
  } catch (e) {
    const t = mensagemDeErro(e);
    if (t) msg("erro", t); else msg("sis", "Interrompido.");
  }
  ocupado = false; olhando = false; ctrl = null;
}

// ---------- configurações ----------
function abreCfg() {
  $("fCriador").value = cfg.criador; $("fChave").value = cfg.chave;
  $("fModelo").value = cfg.modelo; $("fModeloVisao").value = cfg.modeloVisao;
  $("fBase").value = cfg.base; $("fVoz").checked = cfg.voz;
  $("cfg").showModal();
  $("cfg").scrollTop = 0;
}
$("btnCfg").onclick = abreCfg;
$("fechaCfg").onclick = () => $("cfg").close();
$("pGroq").onclick = () => { $("fBase").value = BASE_GROQ; $("fModelo").value = MODELO_PADRAO; $("fModeloVisao").value = VISAO_PADRAO; };
$("pOpen").onclick = () => { $("fBase").value = BASE_OPENROUTER; $("fModelo").value = ""; $("fModeloVisao").value = ""; $("fModelo").placeholder = "escolha em openrouter.ai/models (termina com :free)"; };
$("salvaCfg").onclick = () => {
  cfg.criador = $("fCriador").value.trim() || CRIADOR_PADRAO;
  cfg.chave = $("fChave").value.trim();
  cfg.modelo = $("fModelo").value.trim() || MODELO_PADRAO;
  cfg.modeloVisao = $("fModeloVisao").value.trim() || VISAO_PADRAO;
  cfg.base = $("fBase").value.trim() || BASE_GROQ;
  cfg.voz = $("fVoz").checked;
  gravar("capri_cfg", cfg); atualizaTopo(); $("cfg").close();
  msg("sis", "Configurações salvas.");
};
$("verMem").onclick = () => { $("cfg").close(); msg("capri", memorias.length ? "Eu lembro:\n- " + memorias.join("\n- ") : "Ainda não lembro de nada."); };
$("limpaMem").onclick = () => { if (confirm("Apagar todas as memórias da Capri?")) { memorias = []; gravar("capri_mem", memorias); msg("sis", "Memórias apagadas."); } };
$("btnVoz").onclick = () => { cfg.voz = !cfg.voz; gravar("capri_cfg", cfg); atualizaTopo(); if (!cfg.voz) parar(); };
$("btnParar").onclick = parar;
$("enviar").onclick = () => enviar();
$("txt").addEventListener("keydown", (e) => { if (e.key === "Enter") enviar(); });
$("mic").onclick = ouvir;
$("btnFoto").onclick = () => $("foto").click();
$("foto").onchange = (e) => { const a = e.target.files[0]; e.target.value = ""; enviarFoto(a); };

// ---------- instalar como app ----------
let pedidoInstalar = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); pedidoInstalar = e; $("instalar").hidden = false; });
$("instalar").onclick = () => { if (pedidoInstalar) { pedidoInstalar.prompt(); pedidoInstalar = null; $("instalar").hidden = true; } };
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

pintaIcones();
atualizaTopo();
msg("capri", "Oi, eu sou a Capri, criada por " + cfg.criador + ". Posso conversar, anotar, lembrar de você, abrir sites, ligar, mandar WhatsApp e olhar fotos que você tirar.");
setInterval(tickMascote, 140);
tickMascote();
if (!cfg.chave) setTimeout(abreCfg, 500);
</script>
